<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Оплату отримано — Ridna</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/logo2.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #7E21D5;
      --purple-light: #A855F7;
      --bg: #06040F;
      --text: #EDE8F5;
      --text-soft: #C8BDD9;
      --muted: #7A6E90;
      --success: #34D399;
      --border: rgba(255,255,255,0.08);
      --surface: rgba(255,255,255,0.04);
      --nav-bg: rgba(6,4,15,0.7);
    }
    [data-theme="light"] {
      --bg: #F6F2FC;
      --text: #231433;
      --text-soft: #4A3A60;
      --muted: #6B5B85;
      --success: #16A34A;
      --border: rgba(35,20,51,0.12);
      --surface: #FFFFFF;
      --nav-bg: rgba(255,255,255,0.75);
    }
    [data-theme="light"] .check { background: rgba(22,163,74,0.10); border-color: rgba(22,163,74,0.45); box-shadow: 0 0 40px rgba(22,163,74,0.15); }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(circle at 30% 25%, rgba(126,33,213,0.16), transparent 55%),
        radial-gradient(circle at 70% 80%, rgba(52,211,153,0.10), transparent 55%);
    }
    /* Колонка з рівним вертикальним ритмом — нічого не «стрибає» */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 340px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
    }
    .check {
      width: 76px; height: 76px; margin-bottom: 24px;
      border-radius: 50%;
      background: rgba(52,211,153,0.12);
      border: 1px solid rgba(52,211,153,0.4);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 40px rgba(52,211,153,0.22);
    }
    .check svg { width: 38px; height: 38px; stroke: var(--success); }
    h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 24px; font-weight: 900; letter-spacing: -0.8px;
      color: var(--text); margin-bottom: 10px;
    }
    .lead {
      color: var(--text-soft); font-size: 15px; line-height: 1.6;
    }
    .cta {
      margin-top: 28px;
      width: 100%;
      background: var(--purple); color: #fff !important; text-decoration: none;
      padding: 15px 24px; border-radius: 14px; font-weight: 700; font-size: 15px;
      box-shadow: 0 0 24px rgba(126,33,213,0.4); transition: all 0.2s;
    }
    .cta:hover { background: var(--purple-light); transform: translateY(-1px); }
    .hint {
      margin-top: 20px; font-size: 13px; line-height: 1.5; color: var(--muted);
    }
    .hint a { color: var(--purple-light); text-decoration: none; font-weight: 600; }
    .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: var(--nav-bg); backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid var(--border); }
    .site-header .logo-link { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: opacity 0.2s; }
    .site-header .logo-link:hover { opacity: 0.85; }
    .site-header img { height: 26px; width: auto; display: block; }
    .site-header span { font-family: 'Unbounded', sans-serif; font-size: 17px; font-weight: 900; color: var(--text); letter-spacing: -0.4px; }
    .theme-toggle { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 11px; cursor: pointer; background: var(--surface); border: 1px solid var(--border); color: var(--text); transition: border-color 0.2s, transform 0.15s; }
    .theme-toggle:hover { border-color: var(--purple); transform: translateY(-1px); }
    .theme-toggle svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .theme-toggle .t-dark { display: none; }
    [data-theme="light"] .theme-toggle .t-light { display: none; }
    [data-theme="light"] .theme-toggle .t-dark { display: inline-block; }
  </style>
  <script>(function(){try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
</head>
<body>
  <header class="site-header">
    <a href="https://ridna.net" class="logo-link" aria-label="На головну Ridna"><img src="/logo2.svg" alt="Ridna" /><span>Ridna</span></a>
    <button class="theme-toggle" aria-label="Перемкнути тему" type="button">
      <svg class="t-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      <svg class="t-dark" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5" />
      </svg>
    </div>
    <h1>Оплату отримано</h1>
    <p class="lead">Активуємо підписку — це займає 1–2 хвилини. Повертайся в Ridna, статус оновиться сам.</p>
    <a href="ridna://" class="cta">Повернутися в додаток</a>
    <p class="hint">Не оновилось за кілька хвилин?<br>Напиши <a href="https://t.me/ridna_crm" target="_blank" rel="noopener">@ridna_crm</a></p>
  </div>
<script>(function(){function t(){var r=document.documentElement;var n=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}}document.querySelectorAll('.theme-toggle').forEach(function(b){b.addEventListener('click',t);});try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(e){if(!localStorage.getItem('theme'))document.documentElement.setAttribute('data-theme',e.matches?'dark':'light');});}catch(e){}})();</script>
</body>
</html>
