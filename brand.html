<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Ridna — приватний доступ</title>
<link rel="icon" type="image/svg+xml" href="/logo2.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--purple:#7E21D5;--purple-light:#A855F7;--bg:#06040F;--surface:rgba(255,255,255,.04);--text:#EDE8F5;--muted:#7A6E90;--border:rgba(255,255,255,.09);--danger:#F87171}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 60% at 50% 0%,rgba(126,33,213,.18),transparent 70%)}
  .gate{position:relative;z-index:1;width:100%;max-width:360px;text-align:center}
  .logo{height:44px;margin-bottom:22px}
  h1{font-family:'Unbounded',sans-serif;font-weight:900;font-size:22px;letter-spacing:-.6px;margin-bottom:8px}
  .sub{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:26px}
  form{display:flex;flex-direction:column;gap:12px}
  input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 16px;color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:border-color .18s}
  input:focus{border-color:var(--purple)}
  input::placeholder{color:var(--muted)}
  button{width:100%;background:var(--purple);color:#fff;border:none;border-radius:13px;padding:15px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 0 26px rgba(126,33,213,.4);transition:background .18s,transform .12s}
  button:hover{background:var(--purple-light);transform:translateY(-1px)}
  button:disabled{opacity:.6;cursor:default;transform:none}
  .err{color:var(--danger);font-size:13px;font-weight:600;min-height:18px;margin-top:2px}
</style>
</head>
<body>
  <div class="gate">
    <img class="logo" src="/logo2.svg" alt="Ridna" />
    <h1>Приватний доступ</h1>
    <p class="sub">Ця сторінка захищена паролем. Введи пароль, щоб відкрити брендбук Ridna.</p>
    <form id="f">
      <input id="pw" type="password" placeholder="Пароль" autocomplete="off" autofocus />
      <button id="btn" type="submit">Відкрити</button>
      <div class="err" id="err"></div>
    </form>
  </div>

  async function decrypt(pw){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ct));
    return new TextDecoder().decode(buf);
  }
  var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),btn=document.getElementById('btn');
  f.addEventListener('submit',async function(e){
    e.preventDefault();
    err.textContent='';btn.disabled=true;btn.textContent='Відкриваємо…';
    try{
      var html=await decrypt(pw.value);
      document.open();document.write(html);document.close();
    }catch(_){
      err.textContent='Невірний пароль';
      btn.disabled=false;btn.textContent='Відкрити';
      pw.value='';pw.focus();
    }
  });
</script>
